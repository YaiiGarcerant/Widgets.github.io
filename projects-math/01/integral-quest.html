            'coin-bounce': {
              '0%,100%': { transform: 'translateY(0) rotate(0deg)' },

  <script>
    // ===== Utility helpers =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderLatex(el, tex, displayMode = true) {
      if (!el) return;
      try {
        if (window.katex) {
          window.katex.render(tex, el, {
            displayMode,
            throwOnError: false,
            output: 'html',
          });
        } else {
          el.textContent = tex;
        }
      } catch (e) {
        el.textContent = tex;
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // ===== Game State =====
    const state = {
      screen: 'subjects', // 'subjects' | 'instructions' | 'game' | 'results'
      questions: [],
      currentIndex: 0,
      coins: 0,
      correct: 0,
      incorrect: 0,
      time: 0,
      timerId: null,
      selected: null,
      isCorrect: null,
      showingFeedback: false,
    };

    let chartInstance = null;

    // Build 20 questions: 2 random per level (1..10), with shuffled options
    function buildSession() {
      let result = [];
      for (let level = 1; level <= 10; level++) {
        const pool = integralQuestions.filter(q => q.level === level);
        const picked = shuffle(pool).slice(0, 2);
        for (const q of picked) {
          // Shuffle options but keep track of correct index
          const correctValue = q.options[q.correctIndex];
          const shuffledOptions = shuffle(q.options);
          const newCorrectIndex = shuffledOptions.indexOf(correctValue);
          result.push({
            ...q,
            options: shuffledOptions,
            correctIndex: newCorrectIndex,
          });
        }
      }
      return result;
    }

    function startTimer() {
      stopTimer();
      state.timerId = setInterval(() => {
        state.time += 1;
        const el = document.getElementById('timer-display');
        if (el) el.textContent = formatTime(state.time);
      }, 1000);
    }

    function stopTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function setScreen(screen) {
      state.screen = screen;
      render();
    }

    function startGame() {
      state.questions = buildSession();
      state.currentIndex = 0;
      state.coins = 0;
      state.correct = 0;
      state.incorrect = 0;
      state.time = 0;
      state.selected = null;
      state.isCorrect = null;
      state.showingFeedback = false;
      setScreen('game');
      startTimer();
    }

    function resetGame() {
      stopTimer();
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
      state.questions = [];
      state.currentIndex = 0;
      state.coins = 0;
      state.correct = 0;
      state.incorrect = 0;
      state.time = 0;
      state.selected = null;
      state.isCorrect = null;
      state.showingFeedback = false;
      setScreen('subjects');
    }

    function answerQuestion(idx) {
      if (state.showingFeedback) return;

      const q = state.questions[state.currentIndex];
      const isCorrect = idx === q.correctIndex;

      state.selected = idx;
      state.isCorrect = isCorrect;
      state.showingFeedback = true;

      if (isCorrect) {
        state.coins += 100;
        state.correct += 1;
      } else {
        state.coins = Math.max(0, state.coins - 50);
        state.incorrect += 1;
      }

      if (isCorrect) {
        // Respuesta correcta: avanza directo sin re-renderizar
        nextQuestion();
      } else {
        // Respuesta incorrecta: muestra feedback rojo + pista, luego avanza
        render();
        setTimeout(() => nextQuestion(), 2000);
      }
    }

    function nextQuestion() {
      const next = state.currentIndex + 1;

      // Limpiamos los estados de feedback PRIMERO
      state.selected = null;
      state.isCorrect = null;
      state.showingFeedback = false;

      if (next >= state.questions.length) {
        stopTimer();
        setScreen('results');
        return;
      }

      state.currentIndex = next;

      // Si usas JS puro para renderizar, podrías limpiar el HTML aquí
      // document.getElementById('quiz-container').innerHTML = ''; 

      render();
    }

    // ===== RENDER =====
    function render() {
      const app = document.getElementById('app');

      app.innerHTML = '';

      if (state.screen === 'subjects') {
        app.appendChild(renderSubjects());
      } else if (state.screen === 'instructions') {
        app.appendChild(renderInstructions());
      } else if (state.screen === 'game') {
        app.appendChild(renderGame());
      } else if (state.screen === 'results') {
        app.appendChild(renderResults());
      }

      // Post-render: render LaTeX and set up charts
      if (state.screen === 'game') {
        // Render question LaTeX
        const qEl = document.querySelector('[data-latex="question"]');
        if (qEl) renderLatex(qEl, qEl.dataset.tex, true);

        // Render option LaTeX
        document.querySelectorAll('[data-latex="option"]').forEach(el => {
          renderLatex(el, el.dataset.tex, false);
        });

        // 2. Truco para la barra de progreso:
        const progressBar = document.querySelector('.bg-gradient-to-r');
        if (progressBar) {
          const targetWidth = progressBar.style.width; // Guarda el valor final
          progressBar.style.width = '0%'; // Empieza en 0 (o el valor anterior si lo guardas)

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              progressBar.style.width = targetWidth;
            });
          });
        }

        // Initialize chart
        setupChart();
      }
    }

    // ===== SCREEN: Game =====
    function renderGame() {
      const q = state.questions[state.currentIndex];
      const total = state.questions.length;
      const progress = ((state.currentIndex + (state.showingFeedback ? 1 : 0)) / total) * 100;

      const container = document.createElement('div');
      container.className = 'min-h-screen px-4 py-6 md:py-10';
      container.innerHTML = `
        <div class="max-w-7xl mx-auto">
          <!-- Header -->
          <header class="glass rounded-3xl px-5 py-4 mb-6 flex flex-wrap items-center gap-4">
            <button id="btn-exit" class="shrink-0 w-10 h-10 rounded-xl bg-slate-800/70 hover:bg-slate-700/70 flex items-center justify-center transition-colors" aria-label="Salir">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

              </svg>
            </button>

              </div>
              <div class="h-2 rounded-full bg-slate-800 overflow-hidden">

              </div>
            </div>

            <div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-amber-500/10 border border-amber-500/20">
              <span class="text-xl">🪙</span>
              <span class="font-bold text-amber-300 tabular-nums">${state.coins}</span>
            </div>

            <div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-800/70 border border-slate-700/50">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

              </svg>
              <span id="timer-display" class="font-mono font-semibold text-slate-200 tabular-nums">${formatTime(state.time)}</span>
            </div>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Question Panel -->
            <div class="lg:col-span-2 glass rounded-3xl p-6 md:p-8 ${state.showingFeedback && !state.isCorrect ? 'animate-shake' : 'animate-slide-in'}">
              <p class="text-sm text-indigo-300 uppercase tracking-widest font-medium mb-3">${q.question}</p>

              <div class="flex items-center justify-center py-8 px-4 rounded-2xl bg-slate-900/60 border border-slate-700/50 mb-6 min-h-[140px]">
                <div data-latex="question" data-tex="${escapeAttr(q.latex)}" class="text-slate-50 text-3xl md:text-4xl"></div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${q.options.map((opt, idx) => optionHTML(opt, idx, q.correctIndex)).join('')}
              </div>

              ${state.showingFeedback && !state.isCorrect ? hintHTML(q.hint) : ''}
            </div>

            <!-- Sidebar: Precision -->
            <aside class="space-y-6">
              <div class="glass rounded-3xl p-6">
                <h3 class="text-sm font-semibold uppercase tracking-widest text-slate-400 mb-4">Precisión</h3>

                  <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span class="text-3xl font-bold text-slate-50 tabular-nums">
                      ${state.correct + state.incorrect === 0 ? '0' : Math.round((state.correct / (state.correct + state.incorrect)) * 100)}%
                    </span>
                    <span class="text-xs text-slate-400 mt-1">Acierto</span>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">
                  <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/20 p-3 text-center">
                    <div class="text-2xl font-bold text-emerald-300 tabular-nums">${state.correct}</div>
                    <div class="text-xs text-slate-400 mt-0.5">Correctas</div>
                  </div>
                  <div class="rounded-2xl bg-rose-500/10 border border-rose-500/20 p-3 text-center">
                    <div class="text-2xl font-bold text-rose-300 tabular-nums">${state.incorrect}</div>
                    <div class="text-xs text-slate-400 mt-0.5">Incorrectas</div>

              <div class="glass-card rounded-3xl p-5">

                  Recuerda siempre agregar la constante de integración <strong class="text-indigo-300">+ C</strong> en las integrales indefinidas.
                </p>
              </div>
            </aside>
          </div>
        </div>
      `;



      container.querySelector('#btn-exit').addEventListener('click', showExitAlert);

      // Attach click listeners to answer options
      container.querySelectorAll('[data-option-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-option-idx'), 10);
          answerQuestion(idx);
        });
      });

      return container;
    }

    function optionHTML(opt, idx, correctIdx) {
      const letters = ['A', 'B', 'C', 'D'];
      let classes = 'glass-card border-slate-700/50 hover:border-indigo-400/60 hover:bg-slate-800/60';
      let ring = '';
      const disabled = state.showingFeedback;

      if (state.showingFeedback) {
        if (idx === correctIdx) {
          classes = 'bg-emerald-500/15 border-emerald-400/60 text-emerald-100';
          ring = 'ring-2 ring-emerald-400/60';
        } else if (idx === state.selected) {
          classes = 'bg-rose-500/15 border-rose-400/60 text-rose-100';
          ring = 'ring-2 ring-rose-400/60';
        } else {
          classes = 'glass-card border-slate-700/30 opacity-50';
        }
      }

      return `
        <button
          data-option-idx="${idx}"
          ${disabled ? 'disabled' : ''}
          class="group flex items-center gap-3 text-left px-4 py-4 rounded-2xl border transition-all duration-200 ${classes} ${ring} ${disabled ? 'cursor-not-allowed' : 'hover:scale-[1.02]'}"
        >
          <span class="shrink-0 w-9 h-9 rounded-xl bg-slate-900/50 border border-slate-700/50 flex items-center justify-center text-sm font-bold text-slate-300 group-hover:border-indigo-400/50 group-hover:text-indigo-300 transition-colors">
            ${letters[idx]}
          </span>
          <span data-latex="option" data-tex="${escapeAttr(opt)}" class="flex-1 text-slate-100 text-base"></span>
        </button>
      `;
    }

    function hintHTML(hint) {
      return `
        <div class="mt-5 flex gap-3 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 animate-slide-in">
          <div class="shrink-0 w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-widest text-amber-300 mb-1">Pista</p>
            <p class="text-sm text-amber-100/90 leading-relaxed">${hint}</p>
          </div>
        </div>
      `;
    }

    function setupChart() {
      const canvas = document.getElementById('precisionChart');
      if (!canvas || !window.Chart) return;
      if (chartInstance) {
        chartInstance.destroy();
      }
      const total = state.correct + state.incorrect;
      const data = total === 0 ? [1] : [state.correct, state.incorrect];
      const colors = total === 0 ? ['#1e293b'] : ['#10b981', '#f43f5e'];

      chartInstance = new window.Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: total === 0 ? ['Sin datos'] : ['Correctas', 'Incorrectas'],
          datasets: [{
            data,
            backgroundColor: colors,
            borderColor: 'rgba(15,23,42,0.8)',
            borderWidth: 3,
            hoverOffset: 6,
          }],
        },
        options: {
          cutout: '72%',
          responsive: false,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: total !== 0,
              backgroundColor: 'rgba(15,23,42,0.95)',
              borderColor: 'rgba(99,102,241,0.4)',
              borderWidth: 1,
              titleColor: '#f1f5f9',
              bodyColor: '#cbd5e1',
            },
          },
          animation: { animateRotate: true, duration: 500 },
        },
      });
    }

    // ===== SCREEN: Results =====
    function renderResults() {
      const total = state.questions.length;
      const precision = total === 0 ? 0 : Math.round((state.correct / total) * 100);
      let verdict, color, icon;
      if (precision >= 80) {
        verdict = '¡Maestro Integral!';
        color = 'emerald';
        icon = '🏆';
      } else if (precision >= 60) {
        verdict = '¡Buen trabajo!';
        color = 'indigo';
        icon = '⭐';
      } else if (precision >= 40) {
        verdict = 'Sigue practicando';
        color = 'amber';
        icon = '💪';
      } else {
        verdict = '¡Vuelve a intentarlo!';
        color = 'rose';
        icon = '📚';
      }

      const container = document.createElement('div');
      container.className = 'min-h-screen flex items-center justify-center px-4 py-10';
      container.innerHTML = `
        <div class="max-w-2xl w-full animate-fade-in-scale">
          <div class="glass rounded-4xl p-8 md:p-10 shadow-2xl text-center">
            <div class="w-20 h-20 mx-auto mb-5 rounded-3xl bg-gradient-to-br from-${color}-500 to-${color}-700 flex items-center justify-center text-4xl shadow-2xl shadow-${color}-900/50">
              ${icon}
            </div>
            <p class="text-xs uppercase tracking-widest text-${color}-300 font-medium mb-2">Quest completada</p>
            <h2 class="text-3xl md:text-4xl font-bold text-slate-50 mb-8 text-balance">${verdict}</h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
              <div class="rounded-2xl glass-card p-4">
                <div class="text-2xl font-bold text-amber-300 tabular-nums">${state.coins}</div>
                <div class="text-xs text-slate-400 mt-1">Monedas</div>
              </div>
              <div class="rounded-2xl glass-card p-4">
                <div class="text-2xl font-bold text-indigo-300 tabular-nums">${precision}%</div>
                <div class="text-xs text-slate-400 mt-1">Precisión</div>
              </div>
              <div class="rounded-2xl glass-card p-4">
                <div class="text-2xl font-bold text-emerald-300 tabular-nums">${state.correct}/${total}</div>
                <div class="text-xs text-slate-400 mt-1">Aciertos</div>
              </div>
              <div class="rounded-2xl glass-card p-4">
                <div class="text-2xl font-bold text-slate-200 tabular-nums">${formatTime(state.time)}</div>
                <div class="text-xs text-slate-400 mt-1">Tiempo</div>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
              <button id="btn-home" class="flex-1 px-5 py-3 rounded-2xl glass-card text-slate-200 font-medium hover:bg-slate-800/50 transition-colors">
                Inicio
              </button>
              <button id="btn-replay" class="flex-[2] px-5 py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-indigo-600 text-white font-semibold shadow-lg shadow-indigo-900/50 hover:scale-[1.02] transition-all">
                Jugar de nuevo
              </button>
            </div>
          </div>
        </div>
      `;
      container.querySelector('#btn-home').addEventListener('click', resetGame);
      container.querySelector('#btn-replay').addEventListener('click', startGame);
      return container;
    }

    // ===== Helpers =====
    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }



    const showExitAlert = () => {
      // 1. Crear el elemento contenedor
      const alertOverlay = document.createElement('div');
      alertOverlay.className = 'fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300';

      // 2. Inyectar el HTML con Tailwind
      alertOverlay.innerHTML = `
    <div id="alert-card" class="bg-white rounded-2xl shadow-2xl max-w-sm w-full transform scale-90 transition-transform duration-300 overflow-hidden">
      <div class="p-6 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 mb-4 bg-red-50 rounded-full">
          <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">¿Abandonar laboratorio?</h3>
        <p class="text-gray-500">Si sales ahora, perderás todo el progreso y los cálculos realizados hasta el momento.</p>
      </div>
      <div class="flex border-t border-gray-100">
        <button id="cancel-btn" class="flex-1 px-6 py-4 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">
          CANCELAR
        </button>
        <button id="confirm-btn" class="flex-1 px-6 py-4 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 transition-colors">
          SALIR
        </button>
      </div>
    </div>
  `;

      document.body.appendChild(alertOverlay);

      // 3. Animación de entrada
      setTimeout(() => {
        alertOverlay.classList.remove('opacity-0');
        alertOverlay.querySelector('#alert-card').classList.remove('scale-90');
        alertOverlay.querySelector('#alert-card').classList.add('scale-100');
      }, 10);

      // 4. Lógica de cierre
      const close = (callback) => {
        alertOverlay.classList.add('opacity-0');
        alertOverlay.querySelector('#alert-card').classList.replace('scale-100', 'scale-90');
        setTimeout(() => {
          alertOverlay.remove();
          if (callback) callback();
        }, 300);
      };

      // Eventos
      alertOverlay.querySelector('#confirm-btn').addEventListener('click', () => {
        close(() => resetGame());
      });

      alertOverlay.querySelector('#cancel-btn').addEventListener('click', () => {
        close();
      });
    };

    // ===== Boot =====
    // Wait until KaTeX loads (script is deferred) to ensure rendering works
    window.addEventListener('load', () => {
      render();
    });
  </script>
