<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horizontal Sections Swipe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Banner fijo -->
  <header class="banner">
    <h1>Mi Banner Fijo</h1>

  </div>

  <script src="script.js"></script>
</body>
</html>
