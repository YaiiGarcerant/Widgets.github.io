<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Sections Swipe</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Banner global (fijo, fuera del wrapper) -->
  <header id="banner" class="banner hidden">
    <h1>Mi Banner Fijo</h1>
  </header>

  <!-- Contenedor de secciones -->
  <div id="wrapper">
    <section class="panel hero">Sección Principal</section>
    <section class="panel">Sección 2</section>
    <section class="panel">Sección 3</section>
    <section class="panel">Sección 4</section>
  </div>

  <script src="script.js"></script>
</body>

</html>
