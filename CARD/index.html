<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Sections Swipe</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- Banner -->
  <header id="banner" class="banner">
    <h1>Mi Banner Fijo</h1>
  </header>

  <!-- Barra de progreso -->
<div id="progress-wrapper" class="progress-wrapper">
  <div id="progress-steps" class="progress-steps"></div>
</div>


  <!-- Secciones -->
  <div id="wrapper">
    <section class="panel hero">Sección Principal</section>
    <section class="panel">Sección 2</section>
    <section class="panel">Sección 3</section>
    <section class="panel">Sección 4</section>
  </div>

  <script src="script.js"></script>
</body>

</html>
